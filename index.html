<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Go</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eaf0f2;color:#17252a}
header{background:#087f6e;color:white;padding:18px;font-size:28px;font-weight:bold}
header small{display:block;font-size:13px;font-weight:normal;margin-top:5px}
.tabs{display:flex;background:#066b5d;color:white;justify-content:space-around;padding:14px}
.tabs button{background:transparent;padding:5px;color:white}
.search{padding:12px;background:white}
.search input{width:100%;padding:13px;border:0;border-radius:25px;background:#edf1f3;font-size:16px}
.person{display:flex;align-items:center;gap:12px;padding:15px;background:white;border-bottom:1px solid #eee;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:#cde8df;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.info{flex:1;min-width:0}
.info strong{display:block;margin-bottom:6px}
.info small{color:#667;overflow-wrap:anywhere}
#chat{display:none}
.chathead{padding:12px;background:#f7f7f7;display:flex;gap:12px;align-items:center}
#messages{height:60vh;overflow-y:auto;padding:15px;background:#e8e2d8;display:flex;flex-direction:column}
.msg{padding:10px 13px;background:white;border-radius:12px;margin:6px 0;max-width:85%;overflow-wrap:anywhere}
.mine{background:#d5f8c6;align-self:flex-end}
.send{display:flex;padding:10px;gap:8px;background:#f7f7f7;position:sticky;bottom:0}
.send input{flex:1;min-width:0;border:0;border-radius:25px;padding:12px;font-size:16px}
button{border:0;border-radius:22px;padding:12px 16px;background:#087f6e;color:white;cursor:pointer}
#status,#calls{display:none;padding:20px;background:white;min-height:60vh}
footer{text-align:center;padding:15px;color:#778}
</style>
</head>
<body>

<header>Chat Go <small>Simple messaging app</small></header>

<div class="tabs">
<button onclick="showPage('home')">CHATS</button>
<button onclick="showPage('status')">STATUS</button>
<button onclick="showPage('calls')">CALLS</button>
</div>

<div id="home">
<div class="search">
<input id="search" placeholder="Search chats..." oninput="filterChats()">
</div>
<div id="people">
<div class="person" onclick="openChat('Friend','👤')">
<div class="avatar">👤</div>
<div class="info"><strong>Friend</strong><small>Hello! Welcome to Chat Go</small></div>
</div>
<div class="person" onclick="openChat('Family','👨‍👩‍👧')">
<div class="avatar">👨‍👩‍👧</div>
<div class="info"><strong>Family</strong><small>Welcome to your chat</small></div>
</div>
<div class="person" onclick="openChat('Group Chat','👥')">
<div class="avatar">👥</div>
<div class="info"><strong>Group Chat</strong><small>Start a conversation</small></div>
</div>
</div>
</div>

<div id="chat">
<div class="chathead">
<button onclick="showPage('home')">←</button>
<div class="avatar" id="chatavatar">👤</div>
<strong id="chatname">Friend</strong>
</div>
<div id="messages"></div>
<div class="send">
<input id="message" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>
</div>

<div id="status">
<h3>Status</h3>
<p>Welcome to Chat Go!</p>
</div>

<div id="calls">
<h3>Calls</h3>
<p>Call feature is not connected yet.</p>
</div>

<footer>Chat Go • Made for you</footer>

<script>
let currentChat='';
let chatData={};

function showPage(page){
document.getElementById('home').style.display='none';
document.getElementById('chat').style.display='none';
document.getElementById('status').style.display='none';
document.getElementById('calls').style.display='none';
document.getElementById(page).style.display='block';
}

function openChat(name,emoji){
currentChat=name;
document.getElementById('chatname').textContent=name;
document.getElementById('chatavatar').textContent=emoji;
showPage('chat');
renderMessages();
document.getElementById('message').focus();
}

function renderMessages(){
const box=document.getElementById('messages');
box.innerHTML='';
(chatData[currentChat]||[]).forEach(item=>{
const bubble=document.createElement('div');
bubble.className='msg mine';
bubble.textContent=item;
box.appendChild(bubble);
});
box.scrollTop=box.scrollHeight;
}

function sendMessage(){
const input=document.getElementById('message');
const value=input.value.trim();
if(!value)return;
if(!chatData[currentChat])chatData[currentChat]=[];
chatData[currentChat].push(value);
input.value='';
renderMessages();
}

function filterChats(){
const value=document.getElementById('search').value.toLowerCase();
document.querySelectorAll('.person').forEach(person=>{
person.style.display=person.innerText.toLowerCase().includes(value)?'flex':'none';
});
}
</script>

</body>
</html>
